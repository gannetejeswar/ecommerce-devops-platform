
name: E-Commerce Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - product-service
          - order-service
          - user-service

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: >
          mvn -B
          -f services/${{ matrix.service }}/pom.xml
          clean verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: services/${{ matrix.service }}/target/*.jar
          if-no-files-found: error

  docker-build-and-scan:
    name: Build Docker Image and Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    strategy:
      fail-fast: false
      matrix:
        service:
          - product-service
          - order-service
          - user-service

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build application JAR
        run: >
          mvn -B
          -f services/${{ matrix.service }}/pom.xml
          -DskipTests package

      - name: Build Docker image
        run: |
          docker build \
            -t ecommerce-${{ matrix.service }}:${{ github.sha }} \
            ./services/${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ecommerce-${{ matrix.service }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
